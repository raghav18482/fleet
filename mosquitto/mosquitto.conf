listener 1883
allow_anonymous true

# Persistence matters here, it is not boilerplate. With clean_session=False on both the
# publishers and the backend, the broker holds each client's session -- so QoS 1 messages
# queued for a backend that is restarting survive a broker restart too, rather than being
# dropped on the floor.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type warning
log_type error
log_type notice
